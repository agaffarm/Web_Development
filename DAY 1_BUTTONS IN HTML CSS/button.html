<!DOCTYPE html>
<html lang="en">
<head>
    <title>Button</title>
    <style>
        .Subscribe-btn{
            background-color: red;
            color: black;
            border: none;
            height: 25px;
            width: 80px;
            font-weight: bold;
            margin-right: 2px;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 2px 2px 1px black;
            transition: 1s;
        }
         .Subscribe-btn:hover{
            color: white;
            opacity: 0.5;
         }
         .Join-btn{
            background-color: white;
            color: blue;
            border: 1px solid rgb(88, 88, 224);
            border-width: 2px;
            cursor: pointer;

         }
         .Join-btn:hover{
            color: white;
            background-color: blue;
            border: 2px solid blue;
            opacity: 0.5;

         }
         .Tweet-btn{
            background-color: rgb(0, 191, 255);
            color: white;
            border: none;
            height: 25px;
            width: 80px;
            border-radius: 30px;
            cursor: pointer;
         }
    </style>
</head>
<body>
    <button class="Subscribe-btn">Subscribe</button>
    <button class="Join-btn">Join</button>
    <button class="Tweet-btn">Tweet</button>
</body>
</html>
